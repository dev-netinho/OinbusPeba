name: oinbupebas

# Produção na VPS existente: o Traefik compartilhado termina TLS e roteia
# somente este host. Banco e RabbitMQ permanecem acessíveis apenas na rede
# interna do projeto.
networks:
  traefik-public:
    external: true

services:
  tunnel:
    image: cloudflare/cloudflared:2026.6.1
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?define CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - traefik-public
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started

  caddy:
    profiles: ["disabled-on-shared-proxy"]

  backend:
    # O Mailpit fica fora do perfil de produção; os serviços têm restart e
    # os healthchecks evitam manter uma inicialização falha.
    depends_on: !reset []
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.oinbupebas-api.rule: "Host(`oinbuspeba.olua.me`) && PathPrefix(`/api`)"
      traefik.http.routers.oinbupebas-api.entrypoints: websecure
      traefik.http.routers.oinbupebas-api.tls: "true"
      traefik.http.routers.oinbupebas-api.priority: "100"
      traefik.http.services.oinbupebas-api.loadbalancer.server.port: "8080"

  frontend:
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.oinbupebas-web.rule: "Host(`oinbuspeba.olua.me`)"
      traefik.http.routers.oinbupebas-web.entrypoints: websecure
      traefik.http.routers.oinbupebas-web.tls: "true"
      traefik.http.services.oinbupebas-web.loadbalancer.server.port: "80"

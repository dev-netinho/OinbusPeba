spring:
  application.name: oinbupebas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oinbupebas}
    username: ${DATABASE_USER:oinbupebas}
    password: ${DATABASE_PASSWORD:oinbupebas_local}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:oinbupebas}
    password: ${RABBITMQ_PASSWORD:oinbupebas_local}
    publisher-confirm-type: correlated
    publisher-returns: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties.mail.smtp:
      auth: false
      starttls.enable: false
  servlet.multipart:
    max-file-size: 2MB
    max-request-size: 2MB
  mvc.problemdetails.enabled: true
server:
  forward-headers-strategy: framework
  servlet.session.cookie:
    http-only: true
    same-site: lax
    secure: ${COOKIE_SECURE:false}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    recovery-base-url: ${RECOVERY_BASE_URL:http://localhost:4173/redefinir-senha}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
